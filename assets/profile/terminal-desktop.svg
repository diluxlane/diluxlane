<svg xmlns="http://www.w3.org/2000/svg" width="760" height="515" viewBox="0 0 760 515" role="img" aria-labelledby="title desc"><title id="title">Dilux Lane profile terminal</title><desc id="desc">Engineering technology student, founder of Zyberlane. Building web and immersive experiences and AI and automation experiments. Learning AI, robotics, mechatronics, software and systems engineering and cybersecurity; interested in design and filmmaking.</desc><style>.code{animation:appear .35s ease-out both}@keyframes appear{from{opacity:.75}to{opacity:1}}@media(prefers-reduced-motion:reduce){.code{animation:none}}</style><rect x="1" y="1" width="758" height="513" rx="16" fill="#0d1117" stroke="#30363d"/><path d="M16 1 H744 Q759 1 759 16 V56 H1 V16 Q1 1 16 1" fill="#161b22"/><path d="M1 56 H759" stroke="#30363d"/><circle cx="23" cy="28" r="6" fill="#ff5f56"/><circle cx="44" cy="28" r="6" fill="#ffbd2e"/><circle cx="65" cy="28" r="6" fill="#27c93f"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace"><text x="380" y="34" text-anchor="middle" font-size="13" fill="#9ea7b3">dilux.js — terminal</text><text x="26" y="82" font-size="12" fill="#7d8590">~/diluxlane/profile</text><g class="code" font-size="18" fill="#c9d1d9" xml:space="preserve"><text x="26" y="112"><tspan fill="#3fb950">$</tspan> cat dilux.js</text><text x="26" y="135"><tspan fill="#79c0ff">const</tspan> dilux = {</text><text x="26" y="158">  basedIn: <tspan fill="#ffa3b5">"Sri Lanka"</tspan>,</text><text x="26" y="181">  role: <tspan fill="#ffa3b5">"Engineering Tech Student"</tspan>,</text><text x="26" y="204">  founded: <tspan fill="#ffa3b5">"Zyberlane"</tspan>,</text><text x="26" y="227">  workflow: <tspan fill="#ffa3b5">"AI-assisted building"</tspan>,</text><text x="26" y="250">  building: [</text><text x="26" y="273">    <tspan fill="#ffa3b5">"Web &amp; immersive experiences"</tspan>,</text><text x="26" y="296">    <tspan fill="#ffa3b5">"AI &amp; automation experiments"</tspan></text><text x="26" y="319">  ],</text><text x="26" y="342">  learning: [</text><text x="26" y="365">    <tspan fill="#ffa3b5">"AI, robotics &amp; mechatronics"</tspan>,</text><text x="26" y="388">    <tspan fill="#ffa3b5">"Software &amp; systems engineering"</tspan>,</text><text x="26" y="411">    <tspan fill="#ffa3b5">"Cybersecurity &amp; automation"</tspan></text><text x="26" y="434">  ],</text><text x="26" y="457">  creative: <tspan fill="#ffa3b5">"Design &amp; filmmaking"</tspan></text><text x="26" y="480">};</text></g><rect x="26" y="496" width="8" height="11" fill="#3fb950"/></g></svg>
