<svg xmlns="http://www.w3.org/2000/svg" width="360" height="467" viewBox="0 0 360 467" role="img" aria-labelledby="title desc"><title id="title">Dilux Lane profile terminal</title><desc id="desc">AI-native builder and explorer, building Zyberlane. Building web and immersive experiences and AI and automation experiments. Learning AI, robotics, mechatronics, software and systems engineering and cybersecurity; interested in design and filmmaking.</desc><style>.code{animation:appear .35s ease-out both}@keyframes appear{from{opacity:.75}to{opacity:1}}@media(prefers-reduced-motion:reduce){.code{animation:none}}</style><rect x="1" y="1" width="358" height="465" rx="16" fill="#0d1117" stroke="#30363d"/><path d="M16 1 H344 Q359 1 359 16 V56 H1 V16 Q1 1 16 1" fill="#161b22"/><path d="M1 56 H359" stroke="#30363d"/><circle cx="23" cy="28" r="6" fill="#ff5f56"/><circle cx="44" cy="28" r="6" fill="#ffbd2e"/><circle cx="65" cy="28" r="6" fill="#27c93f"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace"><text x="180" y="34" text-anchor="middle" font-size="13" fill="#9ea7b3">dilux.js — terminal</text><text x="18" y="82" font-size="12" fill="#7d8590">~/diluxlane/profile</text><g class="code" font-size="13" fill="#c9d1d9" xml:space="preserve"><text x="18" y="112"><tspan fill="#3fb950">$</tspan> cat dilux.js</text><text x="18" y="132"><tspan fill="#79c0ff">const</tspan> dilux = {</text><text x="18" y="152">  basedIn: <tspan fill="#ffa3b5">"Sri Lanka"</tspan>,</text><text x="18" y="172">  role: <tspan fill="#ffa3b5">"AI-Native Builder"</tspan>,</text><text x="18" y="192">  brand: <tspan fill="#ffa3b5">"Building Zyberlane"</tspan>,</text><text x="18" y="212">  workflow: <tspan fill="#ffa3b5">"AI-assisted building"</tspan>,</text><text x="18" y="232">  building: [</text><text x="18" y="252">    <tspan fill="#ffa3b5">"Web &amp; immersive experiences"</tspan>,</text><text x="18" y="272">    <tspan fill="#ffa3b5">"AI &amp; automation experiments"</tspan></text><text x="18" y="292">  ],</text><text x="18" y="312">  learning: [</text><text x="18" y="332">    <tspan fill="#ffa3b5">"AI, robotics &amp; mechatronics"</tspan>,</text><text x="18" y="352">    <tspan fill="#ffa3b5">"Software &amp; systems engineering"</tspan>,</text><text x="18" y="372">    <tspan fill="#ffa3b5">"Cybersecurity &amp; automation"</tspan></text><text x="18" y="392">  ],</text><text x="18" y="412">  creative: <tspan fill="#ffa3b5">"Design &amp; filmmaking"</tspan></text><text x="18" y="432">};</text></g><rect x="18" y="448" width="8" height="11" fill="#3fb950"/></g></svg>
